name: Vitalog
options:
  bundleIdPrefix: kr.co.vitalog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode (Swift 6.4 compiler). 추후 6.0으로 상향 가능
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 실기기 빌드 시 본인 팀 ID 입력
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"   # iPhone

targets:
  Vitalog:
    type: application
    platform: iOS
    sources:
      - Vitalog
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.vitalog.Vitalog
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Vitalog/Vitalog.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "오늘의 걸음 수를 읽어 활동을 보여주기 위해 사용합니다."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: StepsWidgetExtension

  StepsWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - StepsWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.vitalog.Vitalog.StepsWidget
        CODE_SIGN_ENTITLEMENTS: StepsWidget/StepsWidget.entitlements
    info:
      path: StepsWidget/Info.plist
      properties:
        CFBundleDisplayName: 오늘 걸음수
        NSHealthShareUsageDescription: "위젯에 오늘의 걸음 수를 표시하기 위해 사용합니다."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
